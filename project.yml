name: SmartFridge
options:
  bundleIdPrefix: com.peter
  deploymentTarget:
    iOS: '17.0'
targets:
  SmartFridge:
    type: application
    platform: iOS
    sources:
      - path: SmartFridge
        excludes: [Web]
      - path: SmartFridge/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.smartfridge.legacy
        INFOPLIST_KEY_CFBundleDisplayName: Fridge Classic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
        CODE_SIGNING_ALLOWED: NO
