<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Smart Fridge</title><link rel="stylesheet" href="style.css"></head>
<body><header class="page-title"><h1>Smart Fridge Tracker</h1></header><main id="scene" role="button" tabindex="0" aria-label="White double-door fridge. Tap to zoom in, then tap to open."></main><p id="render-error" role="alert" hidden>Unable to display the fridge. Please reopen the app.</p><section id="inventory" aria-label="Fridge inventory" inert>
<header class="inventory-header"><div class="inventory-top"><button id="close-fridge" aria-label="Back to closed fridge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button></div></header>
<button id="open-drinks" aria-label="Open drinks cabinet" title="Open drinks cabinet" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
<div class="inventory-scroll"><section id="fridge-section"><div class="shelf-controls"><div><span>Shelves</span><button id="shelf-less" aria-label="Remove shelf"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button><strong id="shelf-count">3</strong><button id="shelf-more" aria-label="Add shelf"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M10 4v12"/></svg></button></div></div><div class="cabinet" id="shelves"></div><p id="inventory-note" class="sr-only" aria-live="polite"></p></section>
<section id="freezer-section"><div class="zone-heading"><span>❄</span><div><h3>Freezer</h3></div></div><div class="cabinet" id="freezer-shelf"></div></section>
<section id="drinks-section" aria-label="Drinks cabinet"><div class="cabinet" id="drinks-shelves"></div></section>
</div>
<section id="list-page" aria-labelledby="list-title" hidden>
  <header class="list-header">
    <div class="recipe-heading"><h1 id="list-title" tabindex="-1">Inventory<span>.</span></h1></div>
    <label class="list-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>
      <input id="stock-search" type="search" placeholder="Search inventory" aria-label="Search inventory" autocomplete="off" enterkeyhint="search">
    </label>
  </header>
  <div id="stock-results"></div>
  <p id="stock-summary" class="sr-only" role="status"></p>
</section>
<section id="recipes-page" aria-label="Recipes" aria-hidden="true" inert></section>
<section id="menu-page" aria-labelledby="settings-title" hidden>
  <header class="recipe-heading"><h1 id="settings-title" tabindex="-1">Settings<span>.</span></h1></header>
  <h2>Account</h2>
  <button id="profile-edit" class="profile-card" aria-haspopup="dialog">
    <span class="profile-avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/></svg>
    </span>
    <span class="profile-copy"><strong id="profile-name">My profile</strong><small>On this device</small></span>
    <span class="profile-action">Edit <span aria-hidden="true">›</span></span>
  </button>
  <button id="profile-qr" aria-haspopup="dialog">
    <img width="70" height="70" alt="">
    <span><strong>My QR code</strong><small>Tap to enlarge</small></span>
    <span class="qr-chevron" aria-hidden="true">›</span>
  </button>
  <dialog id="qr-dialog" aria-labelledby="qr-title">
    <h2 id="qr-title">My QR code</h2>
    <p class="qr-owner"></p>
    <img alt="QR code containing your Smart Fridge account ID">
    <code></code>
    <button type="button" class="recipe-primary">Done</button>
  </dialog>
  <h2>Preferences</h2>
  <label class="settings-row game-setting">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10c2 0 3 2 3.5 4l1 5c.4 2-1.5 3.4-3 2l-3-3h-7l-3 3c-1.5 1.4-3.4 0-3-2l1-5C4 9 5 7 7 7ZM7 9v4m-2-2h4m6-1h.1m2.5 2h.1"/></svg>
    <span><strong id="game-label">Game mode</strong><small id="game-description">Drag and stack items. Expired items shake.</small></span>
    <input id="game-mode" class="settings-switch" type="checkbox" role="switch" aria-labelledby="game-label" aria-describedby="game-description">
  </label>
  <div class="settings-row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.5V12l3.5 2"/></svg>
    <div><h3 id="clock-label">Fridge clock</h3><p>Time on the door display</p></div>
    <fieldset class="clock-options" aria-labelledby="clock-label">
      <label><input type="radio" name="clock" value="12"><span>12h</span></label>
      <label><input type="radio" name="clock" value="24"><span>24h</span></label>
    </fieldset>
  </div>
  <div class="settings-row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.5a2 2 0 0 1 3.4 0l7.2 12.8a2 2 0 0 1-1.7 3H4.8a2 2 0 0 1-1.7-3zM12 9v4m0 3.1v.2"/></svg>
    <div><h3><label for="expiry-markers">Expiry markers</label></h3><p id="expiry-description">Flag expiring items on shelves</p></div>
    <input id="expiry-markers" class="settings-switch" type="checkbox" role="switch" aria-describedby="expiry-description">
  </div>
  <p id="settings-status" role="status"></p>
  <dialog id="profile-dialog" aria-labelledby="profile-title">
    <form id="profile-form">
      <h2 id="profile-title">Edit profile</h2>
      <label class="recipe-field">Display name<input id="profile-input" maxlength="48" required autocomplete="nickname" placeholder="Your name"></label>
      <p class="profile-error" role="alert" hidden></p>
      <div class="profile-buttons"><button type="button" id="profile-cancel">Cancel</button><button type="submit" class="recipe-primary">Save</button></div>
    </form>
  </dialog>
</section>
<nav class="inventory-nav"><button class="active" data-section="fridge-section"><span>▤</span>Fridge</button><button id="list-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.5M4 12h.5M4 18h.5"/></svg>List</button><button id="recipe-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/></svg>Recipe</button><button id="menu-button"><span>☰</span>Menu</button></nav></section>
<dialog id="item-dialog"><button id="dialog-close" aria-label="Close">×</button><h2 id="dialog-title"></h2><form id="category-form"><div id="dialog-body"></div></form></dialog>
<script src="app.js"></script></body></html>
